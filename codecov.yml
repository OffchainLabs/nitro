coverage:
  status:
    project:
      default: false
    patch:
      default:
        informational: true
github_checks:
  annotations: false
comment:
  layout: "reach, diff, components, files"
  behavior: once
  after_n_builds: 2
component_management:
  default_rules:
    statuses:
      - type: project # in this case every component that doesn't have a status defined will have a project type one
        target: 30
  individual_components:
    - component_id: module_stf
      name: STF
      paths:
        # Message arrival and Block Creation
        - arbnode/**
        - execution/gethexec/**
        # Core ArbOS (block production, tx processing, consensus engine)
        - arbos/**
        # Precompiles (L2 precompiled contracts executed during EVM txs)
        - precompiles/**
        # Geth hooks (deterministic execution context for Arbitrum)
        - gethhook/**
        # Inbox multiplexing and batch deserialization
        - arbstate/**
        # Data availability (DA provider registry, AnyTrust tree/util)
        - daprovider/**
        # Batch compression/decompression
        - arbcompress/**
        # WASM I/O for replay binary
        - wavmio/**
        # BLS signatures (AnyTrust keyset validation)
        - blsSignatures/**
        # Generated precompile bindings
        - solgen/go/precompilesgen/**
        # Chain config lookup
        - cmd/chaininfo/**
        # State transfer (ArbOS initialization)
        - statetransfer/**
        # Replay binary entry point
        - cmd/replay/**
        # Shared utilities on the deterministic path
        - arbutil/**
        - util/arbmath/**
        - util/blobs/**
        - util/containers/**
        - util/merkletree/**
        - zeroheavy/**
    - component_id: module_gas
      name: Gas
      paths:
        # L1 data cost pricing (poster fees, price per unit adjustment)
        - arbos/l1pricing/**
        # L2 computation gas pricing (base fee, gas backlog, multi-gas constraints)
        - arbos/l2pricing/**
        # Gas burning and multi-dimensional metering interface
        - arbos/burn/**
        # Stylus/WASM gas metering (ink pricing, data storage costs)
        - arbos/programs/**
        # Retryable ticket submission fee calculation
        - arbos/retryables/**
        # Central pricing state (L1PricingState, L2PricingState)
        - arbos/arbosState/**
        # Storage layer backing pricing state
        - arbos/storage/**
        # Root arbos files: tx_processor (gas charging/refunds), block_processor (block gas limits), internal_tx (pricing updates)
        - arbos/*
        # ArbOS utilities (transfers, tracing for gas accounting)
        - arbos/util/**
        # Gas-related precompiles (ArbGasInfo, ArbOwner gas params)
        - precompiles/**
        # Geth integration (creates TxProcessor for gas charging hooks)
        - gethhook/**
        # Safe math primitives for gas calculations
        - util/arbmath/**
    - component_id: module_filteredtx
      name: FilteredTx
      paths:
        # On-chain filtered transaction hash registry
        - arbos/filteredTransactions/**
        # Off-chain address filter service (S3-synced hash list, async address checking)
        - execution/gethexec/addressfilter/**
        # Event-based address extraction for filtering
        - execution/gethexec/eventfilter/**
        # Transaction filtering adapter for eth_call/eth_estimateGas
        - execution/gethexec/tx_filterer.go
        # RPC client to the transaction-filterer service
        - execution/gethexec/transaction_filterer_client.go
        # Precompile for on-chain filter management (add/remove/query filtered tx hashes)
        - precompiles/ArbFilteredTransactionsManager.go
        - precompiles/ArbFilteredTransactionsManager_test.go
        # Standalone transaction-filterer service (receives hashes, submits to precompile)
        - cmd/transaction-filterer/**
        # S3 syncer used by address filter to poll restricted address hashes
        - util/s3syncer/**
        # ArbOS state accessors for filtering (TransactionFilterers, FilteredFundsRecipient)
        - arbos/arbosState/**
        # Address set used for authorized transaction filterers
        - arbos/addressSet/**
        # Storage backend for filtered transaction state
        - arbos/storage/**
    - component_id: module_startup
      name: Startup
      paths:
        # Configuration and CLI
        - cmd/nitro/config/**
        - cmd/util/**
        - cmd/chaininfo/**
        - cmd/genericconf/**
        - cmd/conf/**
        # Parent Chain connection
        - util/rpcclient/**
        - util/headerreader/**
        - solgen/go/**
        # Validator setup
        - staker/legacy/**
        - staker/validatorwallet/**
        - validator/valnode/**
        - arbnode/resourcemanager/**
        # Execution Layer
        - cmd/nitro/init/**
        - execution/gethexec/**
        - execution/nodeinterface/**
        # Consensus Layer
        - arbnode/**
        - daprovider/**
        # Startup Orchestration
        - execution_consensus/**
        - blocks_reexecutor/**
        - util/signature/**
        - util/iostat/**
    - component_id: module_validation
      name: Validation
      paths:
        # BoLD dispute protocol (bisection, edge tracking, assertion chain, history commitments)
        - bold/**
        # Staker: assertion posting, stake management, challenge backends, validator wallet
        - staker/**
        # Block validator and validation-server clients (arb prover, JIT, common plumbing)
        - validator/**
        # Standalone validation-server binary
        - cmd/nitro-val/**
        # Replaying recorded blocks for spot checks / reexecution
        - blocks_reexecutor/**
        # Merkle proofs used by challenge history commitments
        - util/merkletree/**
    - component_id: module_sequencing
      name: Sequencing
      paths:
        # Sequencer: tx ordering, express-lane sequencing, pre-check, forwarding to active sequencer
        - execution/gethexec/sequencer.go
        - execution/gethexec/tx_pre_checker.go
        - execution/gethexec/forwarder.go
        # Transaction streamer (canonical message feed into execution)
        - arbnode/transaction_streamer.go
        # Batch poster (compresses messages, posts batches to the parent-chain SequencerInbox)
        - arbnode/batch_poster.go
        - arbnode/compression_level.go
        # Parent-chain transaction posting (nonce management, gas pricing, blob/calldata posting)
        - arbnode/dataposter/**
        # Inbox: reading parent-chain batches, tracking delayed messages, sequencer inbox decode
        - arbnode/inbox_reader.go
        - arbnode/inbox_tracker.go
        - arbnode/sequencer_inbox.go
        - arbnode/delayed.go
        - arbnode/delayed_sequencer.go
        - arbnode/delay_buffer.go
        # Highly-available sequencer coordination via Redis (failover, chosen-sequencer election)
        - arbnode/seq_coordinator.go
        - arbnode/redislock/**
        - cmd/seq-coordinator-manager/**
        - cmd/seq-coordinator-invalidate/**
        # Message DB pruning and node maintenance windows
        - arbnode/message_pruner.go
        - arbnode/maintenance.go
        # Redis and DB helpers backing coordination and persistence
        - util/redisutil/**
        - util/dbutil/**
    - component_id: module_feed
      name: Feed
      paths:
        # Broadcaster: serves the sequencer feed, message backlog, wire message format
        - broadcaster/**
        # WebSocket broadcast server (client connection/management, rate limiting)
        - wsbroadcastserver/**
        # Feed clients (single endpoint and multi-endpoint aggregation/dedup)
        - broadcastclient/**
        - broadcastclients/**
        # Relay: re-broadcasts the feed to downstream clients
        - relay/**
        - cmd/relay/**
    - component_id: module_da
      name: DataAvailability
      paths:
        # DA provider registry, readers/writers, AnyTrust tree/util, reference DA, data streaming
        - daprovider/**
        # BLS signatures used for AnyTrust committee keyset validation
        - blsSignatures/**
        # DA-related binaries (provider server, AnyTrust committee server/tooling)
        - cmd/daprovider/**
        - cmd/anytrustserver/**
        - cmd/anytrusttool/**
        - cmd/dataavailability/**
        # Blob (EIP-4844) encoding/decoding helpers
        - util/blobs/**
        # S3 client used by DA storage backends
        - util/s3client/**
    - component_id: module_timeboost
      name: Timeboost
      paths:
        # Express-lane auction: auctioneer, bid cache/validation, bidder client, generated bindings
        - timeboost/**
        # Autonomous auctioneer binary and bidder client binary
        - cmd/autonomous-auctioneer/**
        - cmd/bidder-client/**
    - component_id: module_mel
      name: MEL
      paths:
        # Message Execution Layer core types and state on the consensus node
        - arbnode/mel/**
        # MEL replay program (delayed-message DB, state derivation under replay)
        - mel-replay/**
        # WASM I/O shim for the MEL replay binary
        - melwavmio/**
        # MEL replay binary entry point
        - cmd/mel-replay/**