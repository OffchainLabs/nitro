name: Setup build environment
description: Initialize git submodules and optionally install native build dependencies.

inputs:
  apt-packages:
    description: "Space-separated apt packages to install (leave empty to skip)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Init submodules
      shell: bash
      run: git submodule update --init --recursive --depth 1

    - name: Install build deps
      if: inputs.apt-packages != ''
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ${{ inputs.apt-packages }}
