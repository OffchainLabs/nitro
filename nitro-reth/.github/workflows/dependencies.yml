name: dependencies

on:
  pull_request:

permissions:
  contents: read
  # rustsec/audit-check posts its findings as a check run.
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deny-and-audit:
    name: cargo deny & audit
    runs-on: ocl-8cpu-32ram
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@0abfcd587b70a713fdaa7fb502c885e2112acb15 # v2.75.7
        with:
          tool: cargo-deny
      # Advisories are checked separately below via rustsec/audit-check, so
      # this only runs the categories cargo-deny uniquely covers.
      - run: cargo deny check bans licenses sources
      # The ignore list lives in .cargo/audit.toml.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
