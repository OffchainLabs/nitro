name: dependencies

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  deny-and-audit:
    name: cargo deny & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Advisories are checked separately below via rustsec/audit-check, so
      # this only runs the categories cargo-deny uniquely covers.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
      # The ignore list lives in .cargo/audit.toml.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
