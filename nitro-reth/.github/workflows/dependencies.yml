name: dependencies

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deny-and-audit:
    name: cargo deny & audit
    runs-on: ocl-2cpu-8ram-dind
    steps:
      - uses: actions/checkout@v6
      # The dind runner doesn't have cargo installed
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
      # Advisories are checked separately below via rustsec/audit-check, so
      # this only runs the categories cargo-deny uniquely covers.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
      # The ignore list lives in .cargo/audit.toml.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
