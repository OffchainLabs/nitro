[workspace]
members = [
    "crates/arb-primitives",
    "crates/arb-chainspec",
    "crates/arb-context",
    "crates/arb-math",
    "crates/arb-parent-chain-client",
    "crates/arb-storage",
    "crates/arb-storage-errors",
    "crates/arb-errors",
    "crates/arb-evm",
    "crates/arb-precompiles",
    "crates/arb-node",
    "crates/arb-payload",
    "crates/arb-rpc",
    "crates/arb-txpool",
    "crates/arb-executor-tests",
    "crates/arb-spec-tests",
    "crates/arb-stylus",
    "crates/arb-test-utils",
    "crates/arb-test-harness",
    "crates/arb-fuzz",
    "crates/arb-bench",
    "crates/arbos",
    "bin/arb-reth",
    "bin/arb-test",
]
exclude = ["brotli"]
resolver = "2"

[workspace.package]
authors = ["0xBloctopus", "Offchain Labs"]
edition = "2024"
license = "BUSL-1.1"
repository = "https://github.com/OffchainLabs/arbitrum-reth"
rust-version = "1.93"
version = "0.1.5"

[workspace.dependencies]
# Internal crates
arb-primitives = { path = "crates/arb-primitives" }
arb-chainspec = { path = "crates/arb-chainspec" }
arb-context = { path = "crates/arb-context" }
arb-math = { path = "crates/arb-math" }
arb-storage = { path = "crates/arb-storage" }
arb-storage-errors = { path = "crates/arb-storage-errors" }
arb-errors = { path = "crates/arb-errors" }
arb-evm = { path = "crates/arb-evm" }
arb-precompiles = { path = "crates/arb-precompiles" }
arb-node = { path = "crates/arb-node" }
arb-payload = { path = "crates/arb-payload" }
arb-rpc = { path = "crates/arb-rpc" }
arb-txpool = { path = "crates/arb-txpool" }

arb-stylus = { path = "crates/arb-stylus" }
arb-executor-tests = { path = "crates/arb-executor-tests" }
arb-test-utils = { path = "crates/arb-test-utils" }
arb-test-harness = { path = "crates/arb-test-harness" }
arb-spec-tests = { path = "crates/arb-spec-tests" }
arbos = { path = "crates/arbos" }

# Reth SDK (official)
reth = { git = "https://github.com/paradigmxyz/reth.git", rev = "20cfb2d517" }
