reth-trie-db = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.0.0" }
reth-trie-parallel = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.0.0" }
reth-trie-sparse = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.0.0" }
reth-metrics = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.0.0" }

# Alloy
alloy-primitives = { version = "1.5", default-features = false, features = [
    "map-foldhash",
] }
alloy-consensus = { version = "1.8.2", default-features = false }
alloy-eips = { version = "1.8.2", default-features = false }
alloy-evm = { version = "0.30.0", features = ["rpc"] }
alloy-rpc-types-eth = { version = "1.8.2" }
alloy-genesis = { version = "1.8.2" }
alloy-network = { version = "1.8.2" }
alloy-provider = { version = "1.8.2", default-features = false }
alloy-rlp = { version = "0.3", features = ["derive"] }
alloy-rpc-client = { version = "1.8.2" }
alloy-rpc-types = { version = "1.8.2" }
alloy-rpc-types-beacon = { version = "1.8.2" }
alloy-rpc-types-engine = { version = "1.8.2" }
alloy-rpc-types-trace = { version = "1.8.2" }
alloy-serde = { version = "1.8.2" }
alloy-transport = { version = "1.8.2" }
alloy-sol-types = { version = "1.5.6" }
alloy-trie = { version = "0.9.4" }
alloy-hardforks = { version = "0.4.5" }

# Revm
revm = { version = "36.0.0", features = [
    "optional_balance_check",
    "optional_eip3541",
    "optional_eip3607",
    "optional_priority_fee_check",
    "optional_eip7623",
    "optional_no_base_fee",
] }
revm-database = { version = "12.0.0" }
revm-database-interface = { version = "10.0.0" }
revm-state = { version = "10.0.0" }
revm-primitives = { version = "22.1.0" }
revm-interpreter = { version = "34.0.0" }
revm-context = { version = "15.0.0" }
revm-bytecode = { version = "9.0.0" }

# Arb-alloy
arb-alloy-consensus = { version = "0.1.2" }
arb-alloy-predeploys = { version = "0.1.2" }

# Common
crossbeam-channel = { version = "0.5" }
futures = { version = "0.3" }
c-kzg = { version = "2.1.7" }
thiserror = { version = "2" }
serde = { version = "1" }
serde_json = { version = "1" }
tokio = { version = "1" }
tracing = { version = "0.1" }
rustc-hash = { version = "2.1" }
rayon = { version = "1.11" }
clap = { version = "4" }
async-trait = { version = "0.1.68" }
eyre = { version = "0.6" }
anyhow = { version = "1" }
derive_more = { version = "2" }
bytes = { version = "1" }
parking_lot = { version = "0.12" }
lazy_static = { version = "1" }
hex = { version = "0.4" }
cc = { version = "1" }
sha2 = { version = "0.11" }
base64 = { version = "0.22" }
jsonrpsee = { version = "0.26.0" }
jsonrpsee-http-client = { version = "0.26.0" }
brotli = { version = "8", default-features = false }
axum = { version = "0.7", default-features = false }
chrono = { version = "0.4", default-features = false }
csv = { version = "1" }
futures-util = { version = "0.3" }
k256 = { version = "0.13", default-features = false }
libc = { version = "0.2" }
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3" }
reqwest = { version = "0.12", default-features = false }
sysinfo = { version = "0.32", default-features = false }
tokio-stream = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
ureq = { version = "2", default-features = false }
walkdir = { version = "2" }
wat = { version = "1" }
wiremock = { version = "0.6" }

# Nitro repo dependencies
nitro-arbutil = { package = "arbutil", path = "../crates/arbutil" }
nitro-brotli = { package = "brotli", path = "../crates/brotli" }
nitro-prover = { package = "prover", path = "../crates/prover", default-features = false, features = ["cc_brotli"] }
wasmer = { path = "../crates/tools/wasmer/lib/api", default-features = false }
wasmer-compiler = { path = "../crates/tools/wasmer/lib/compiler" }
wasmer-types = { path = "../crates/tools/wasmer/lib/types" }

# Transitive deps for Nitro crates
tiny-keccak = { version = "2.0.2" }
wasmparser = { version = "0.121" }

# Test deps
rstest = { version = "0.26" }
proptest = { version = "1" }
criterion = { version = "0.5" }
tempfile = { version = "3" }

# Fuzzing
arbitrary = { version = "1" }
libfuzzer-sys = { version = "0.4" }
wasm-smith = { version = "0.227" }

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Structural complexity — acceptable for this codebase
too_many_arguments = "allow"
type_complexity = "allow"
result_unit_err = "allow"
new_without_default = "allow"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.maxperf]
inherits = "release"
lto = "fat"

[profile.fastdev]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
