# Arb-alloy
arb-alloy-consensus = { version = "0.1.2" }
arb-alloy-predeploys = { version = "0.1.2" }

# Common
crossbeam-channel = { version = "0.5" }
futures = { version = "0.3" }
c-kzg = { version = "2.1.7" }
thiserror = { version = "2" }
serde = { version = "1" }
serde_json = { version = "1" }
tokio = { version = "1" }
tracing = { version = "0.1" }
rustc-hash = { version = "2.1" }
rayon = { version = "1.11" }
clap = { version = "4" }
async-trait = { version = "0.1.68" }
eyre = { version = "0.6" }
anyhow = { version = "1" }
derive_more = { version = "2" }
bytes = { version = "1" }
parking_lot = { version = "0.12" }
lazy_static = { version = "1" }
hex = { version = "0.4" }
cc = { version = "1" }
sha2 = { version = "0.11" }
base64 = { version = "0.22" }
jsonrpsee = { version = "0.26.0" }
jsonrpsee-http-client = { version = "0.26.0" }
brotli = { version = "8", default-features = false }
wasmer = { git = "https://github.com/OffchainLabs/wasmer.git", rev = "5e7d8fd287436b01fa52d8dbcc9674b3cc7a66ca", default-features = false }
wasmer-compiler = { git = "https://github.com/OffchainLabs/wasmer.git", rev = "5e7d8fd287436b01fa52d8dbcc9674b3cc7a66ca" }
wasmer-types = { git = "https://github.com/OffchainLabs/wasmer.git", rev = "5e7d8fd287436b01fa52d8dbcc9674b3cc7a66ca" }
axum = { version = "0.7", default-features = false }
chrono = { version = "0.4", default-features = false }
csv = { version = "1" }
futures-util = { version = "0.3" }
k256 = { version = "0.13", default-features = false }
libc = { version = "0.2" }
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3" }
reqwest = { version = "0.12", default-features = false }
sysinfo = { version = "0.32", default-features = false }
tokio-stream = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
ureq = { version = "2", default-features = false }
walkdir = { version = "2" }
wat = { version = "1" }

nitro-prover = { package = "prover", git = "https://github.com/OffchainLabs/nitro.git", rev = "b1cf6db81afbc1f67c898ac9add5d37391ebd87b", default-features = false }
nitro-arbutil = { package = "arbutil", git = "https://github.com/OffchainLabs/nitro.git", rev = "b1cf6db81afbc1f67c898ac9add5d37391ebd87b" }
nitro-brotli = { package = "brotli", git = "https://github.com/OffchainLabs/nitro.git", rev = "b1cf6db81afbc1f67c898ac9add5d37391ebd87b" }

# Transitive deps for Nitro crates
tiny-keccak = { version = "2.0.2" }
wasmparser = { version = "0.121" }

# Test deps
rstest = { version = "0.26" }
proptest = { version = "1" }
criterion = { version = "0.5" }
tempfile = { version = "3" }

# Fuzzing
arbitrary = { version = "1" }
libfuzzer-sys = { version = "0.4" }
wasm-smith = { version = "0.227" }

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Structural complexity — acceptable for this codebase
too_many_arguments = "allow"
type_complexity = "allow"
result_unit_err = "allow"
new_without_default = "allow"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.maxperf]
inherits = "release"
lto = "fat"

[profile.fastdev]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
