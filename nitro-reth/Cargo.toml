[workspace]
members = [
    "crates/arb-primitives",
    "crates/arb-consensus/blob-client",
    "crates/arb-chainspec",
    "crates/arb-consensus/db",
    "crates/arb-context",
    "crates/arb-consensus/da-provider",
    "crates/arb-consensus/da-provider/rpc-client",
    "crates/arb-math",
    "crates/arb-consensus/mel",
    "crates/arb-consensus/mel/db",
    "crates/arb-consensus/mel/types",
    "crates/arb-consensus/parent-chain-client",
    "crates/arb-consensus/mel/runner",
    "crates/arb-storage",
    "crates/arb-storage-errors",
    "crates/arb-errors",
    "crates/arb-evm",
    "crates/arb-precompiles",
    "crates/arb-node",
    "crates/arb-payload",
    "crates/arb-rpc",
    "crates/arb-txpool",
    "crates/arb-executor-tests",
    "crates/arb-spec-tests",
    "crates/arb-stylus",
    "crates/arb-test-utils",
    "crates/arb-test-harness",
    "crates/arb-fuzz",
    "crates/arb-bench",
    "crates/arbos",
    "crates/arbos-types",
    "bin/arb-reth",
    "bin/arb-test",
]
resolver = "3"

[workspace.package]
authors = ["0xBloctopus", "Offchain Labs"]
edition = "2024"
license = "BUSL-1.1"
repository = "https://github.com/OffchainLabs/arbitrum-reth"
rust-version = "1.93"
version = "0.1.5"

[workspace.dependencies]
# Internal crates
arb-primitives = { path = "crates/arb-primitives" }
arb-blob-client = { path = "crates/arb-consensus/blob-client" }
arb-chainspec = { path = "crates/arb-chainspec" }
arb-consensus-db = { path = "crates/arb-consensus/db" }
arb-context = { path = "crates/arb-context" }
arb-da-provider = { path = "crates/arb-consensus/da-provider" }
arb-da-provider-rpc-client = { path = "crates/arb-consensus/da-provider/rpc-client" }
arb-math = { path = "crates/arb-math" }
arb-mel = { path = "crates/arb-consensus/mel" }
arb-mel-db = { path = "crates/arb-consensus/mel/db" }
arb-mel-types = { path = "crates/arb-consensus/mel/types" }
arb-parent-chain-client = { path = "crates/arb-consensus/parent-chain-client" }
arb-mel-runner = { path = "crates/arb-consensus/mel/runner" }
arb-storage = { path = "crates/arb-storage" }
arb-storage-errors = { path = "crates/arb-storage-errors" }
arb-errors = { path = "crates/arb-errors" }
arb-evm = { path = "crates/arb-evm" }
arb-precompiles = { path = "crates/arb-precompiles" }
arb-node = { path = "crates/arb-node" }
arb-payload = { path = "crates/arb-payload" }
arb-rpc = { path = "crates/arb-rpc" }
arb-txpool = { path = "crates/arb-txpool" }

arb-stylus = { path = "crates/arb-stylus" }
arb-executor-tests = { path = "crates/arb-executor-tests" }
arb-test-utils = { path = "crates/arb-test-utils" }
arb-test-harness = { path = "crates/arb-test-harness" }
arb-spec-tests = { path = "crates/arb-spec-tests" }
arbos = { path = "crates/arbos" }
arbos-types = { path = "crates/arbos-types" }

# Reth SDK (official)
reth = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.0.0" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.0.0" }
reth-consensus = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.0.0" }
reth-evm = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.0.0" }
