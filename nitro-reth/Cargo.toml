reth-network-api = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.0.0" }
reth-network-p2p = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.0.0" }
reth-node-events = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.0.0" }
reth-tokio-util = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.0.0" }
reth-prune = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.0.0" }
reth-stages-api = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.0.0" }
reth-stages = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.0.0" }
reth-static-file = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.0.0" }
