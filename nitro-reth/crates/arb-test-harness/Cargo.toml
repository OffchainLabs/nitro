[package]
name = "arb-test-harness"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Shared test orchestration for arbreth: spawn nodes, build L1 messages, capture state, diff dual-exec runs against Nitro reference."

[dependencies]
arb-node = { workspace = true }
arb-primitives = { workspace = true }
arbos = { workspace = true }

alloy-primitives = { workspace = true, features = ["std", "serde", "k256"] }
alloy-consensus = { workspace = true, features = ["std", "k256"] }
alloy-eips = { workspace = true, features = ["std"] }


k256 = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }

# Sync JSON-RPC client (no async dep here; mirrors arb-spec-tests choice)
ureq = { workspace = true, features = ["json"] }

# Mock L1 server backend (kept lightweight; reused by spec tests)
axum = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true
