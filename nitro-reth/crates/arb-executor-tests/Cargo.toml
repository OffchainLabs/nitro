[package]
name = "arb-executor-tests"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Internal-API tests for the Arbitrum block executor and supporting components."

[dependencies]
arb-test-utils = { workspace = true }
arbos = { workspace = true }
arb-storage = { workspace = true }
arb-primitives = { workspace = true }
arb-alloy-consensus = { workspace = true }
arb-evm = { workspace = true }
arb-stylus = { workspace = true }
alloy-primitives = { workspace = true, features = ["std", "k256"] }
alloy-consensus = { workspace = true, features = ["k256"] }
alloy-eips = { workspace = true }
alloy-evm = { workspace = true }
reth-evm = { workspace = true }
reth-chainspec = { workspace = true }
revm = { workspace = true, features = ["optional_balance_check", "optional_eip3541", "optional_eip3607", "optional_priority_fee_check", "optional_eip7623", "optional_no_base_fee"] }
k256 = { workspace = true, features = ["ecdsa"] }

[dev-dependencies]
arb-context = { workspace = true }
arb-node = { workspace = true }
reth-revm = { workspace = true }
reth-storage-api = { workspace = true }
reth-primitives-traits = { workspace = true }
revm-database-interface = { workspace = true }
revm-state = { workspace = true }
reth-db-api = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
