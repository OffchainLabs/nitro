[package]
name = "arb-mel-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
# `macros` for `try_join!`, used to issue the prefetcher's range reads concurrently.
tokio = { workspace = true, features = ["macros"] }

alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-sol-types.workspace = true

arb-parent-chain-client.workspace = true
arb-mel.workspace = true
arb-da-provider.workspace = true
arbos.workspace = true

[dev-dependencies]
# Enable the parent-chain client's test builders for our tests.
arb-parent-chain-client = { workspace = true, features = ["test-utils"] }
# `rt` for `#[tokio::test]` and the concurrency probe's `yield_now`.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# For building signed transactions in the logs/headers fetcher tests.
alloy-consensus = { workspace = true }

[lints]
workspace = true
