[package]
name = "arb-bench"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Performance benchmarking framework and corpus runner for arbreth"

[[bin]]
name = "arbreth-bench"
path = "src/bin/arbreth_bench.rs"

[dependencies]
alloy-eips = { workspace = true }
alloy-evm = { workspace = true }
alloy-primitives = { workspace = true, features = ["std", "k256", "serde"] }
arb-evm = { workspace = true }
arb-executor-tests = { workspace = true }
arb-primitives = { workspace = true }
arb-test-utils = { workspace = true }
# Subprocess runner
base64 = { workspace = true }
brotli = { workspace = true, features = ["std"] }
chrono = { workspace = true, features = ["clock", "serde"] }
clap = { workspace = true, features = ["derive"] }
# Reporting
csv = { workspace = true }
eyre = { workspace = true }
hex = { workspace = true }
# CPU time syscalls
libc = { workspace = true }
# Bootstrap CI + synthetic generators + prewarm alloc
rand = { workspace = true, features = ["std", "std_rng"] }
rand_chacha = { workspace = true }
# Frozen-corpus fetcher
reqwest = { workspace = true, features = [
    "rustls-tls",
    "blocking",
    "stream",
    "json",
] }
reth-chainspec = { workspace = true }
reth-evm = { workspace = true }
revm = { workspace = true, features = [
    "optional_balance_check",
    "optional_eip3541",
    "optional_eip3607",
    "optional_priority_fee_check",
    "optional_eip7623",
    "optional_no_base_fee",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Process info for RSS
sysinfo = { workspace = true, features = ["system"] }
tiny-keccak = { workspace = true, features = ["keccak"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# Stylus WASM assembly at generate-time
wat = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
tempfile = { workspace = true }

[[bench]]
name = "block_executor"
harness = false

[[bench]]
name = "tx_decode"
harness = false

[[bench]]
name = "precompile_dispatch"
harness = false

[[bench]]
name = "state_root"
harness = false

[[bench]]
name = "stylus_dispatch"
harness = false

[[bench]]
name = "stylus_ink_metering"
harness = false

[[bench]]
name = "retryable_sweep"
harness = false

[lints]
workspace = true
