[package]
name = "arb-bench"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Performance benchmarking framework and corpus runner for arbreth"

[[bin]]
name = "arbreth-bench"
path = "src/bin/arbreth_bench.rs"

[dependencies]
arb-evm = { workspace = true }
arb-primitives = { workspace = true }
arb-test-utils = { workspace = true }
arb-executor-tests = { workspace = true }

alloy-eips = { workspace = true }
alloy-evm = { workspace = true }
alloy-primitives = { workspace = true, features = ["std", "k256", "serde"] }

reth-chainspec = { workspace = true }
reth-evm = { workspace = true }
revm = { workspace = true }

clap = { workspace = true }
eyre = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Bootstrap CI + synthetic generators + prewarm alloc
rand = { workspace = true }
rand_chacha = { workspace = true }

# Process info for RSS
sysinfo = { workspace = true }

# CPU time syscalls
libc = { workspace = true }

# Reporting
csv = { workspace = true }
chrono = { workspace = true }

# Frozen-corpus fetcher
reqwest = { workspace = true }

# Subprocess runner
base64 = { workspace = true }

# Stylus WASM assembly at generate-time
wat = { workspace = true }
brotli = { workspace = true }
tiny-keccak = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "block_executor"
harness = false

[[bench]]
name = "tx_decode"
harness = false

[[bench]]
name = "precompile_dispatch"
harness = false

[[bench]]
name = "state_root"
harness = false

[[bench]]
name = "stylus_dispatch"
harness = false

[[bench]]
name = "stylus_ink_metering"
harness = false

[[bench]]
name = "retryable_sweep"
harness = false

[lints]
workspace = true
