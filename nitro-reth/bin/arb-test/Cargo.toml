[package]
name = "arb-test"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Unified testing CLI for arbreth: fixture record/verify/compare/promote/triage, genesis-capture, sepolia-import."

[[bin]]
name = "arb-test"
path = "src/main.rs"

[dependencies]
alloy-primitives = { workspace = true, features = ["std", "serde"] }
anyhow = { workspace = true }
arb-spec-tests = { workspace = true }
arb-test-harness = { workspace = true }
clap = { workspace = true, features = ["env", "derive"] }
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ureq = { workspace = true, features = ["json", "tls"] }

[lints]
workspace = true
