---
name: 'Lint Go Code'
description: 'Runs golangci-lint, the custom linters, and solhint via `make lint` so the tool versions pinned in the Makefile are the single source of truth.'

runs:
  using: composite

  steps:
    - name: Cache golangci-lint analysis
      uses: actions/cache@v5
      with:
        path: ~/.cache/golangci-lint
        # github.sha prevents exact-key hits, which would skip the save and
        # let the cache go stale.
        key: ${{ runner.os }}-golangci-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
        # Stale restores are safe: golangci-lint invalidates per file/config.
        restore-keys: |
          ${{ runner.os }}-golangci-${{ hashFiles('**/go.sum') }}-
          ${{ runner.os }}-golangci-

    - name: Lint
      shell: bash
      run: make lint
