---
name: Initialize submodules
description: >
  Initializes all submodules recursively. When the repository name ends
  in -private, rewrites submodule URLs listed in .private-submodules.conf
  to their -private variants and authenticates using the GitHub App
  installation token. Errors if the repo is private but the App is not
  configured.

inputs:
  client-id:
    description: GitHub App Client ID (vars.NITRO_CI_APP_CLIENT_ID).
    required: false
    default: ''
  app-private-key:
    description: GitHub App private key PEM (secrets.NITRO_CI_APP_PRIVATE_KEY).
    required: false
    default: ''

outputs:
  token:
    description: App installation token — exposed so callers can reuse it (e.g. docker build secrets).
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: composite

  steps:
    # An equivalent recipe is inlined in submodule-pin-check.yml —
    # that workflow can't call composite actions under pull_request_target.
    - id: scope
      if: inputs.client-id != '' && inputs.app-private-key != ''
      shell: bash
      run: |
        repos=$(
          echo "${GITHUB_REPOSITORY##*/}"
          awk 'NF && !/^[[:space:]]*#/ {print $1"-private"}' .private-submodules.conf
        )
        echo "App-token repo scope:"
        echo "$repos"
        {
          echo 'repos<<EOF'
          echo "$repos"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - id: app-token
      if: inputs.client-id != '' && inputs.app-private-key != ''
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ steps.scope.outputs.repos }}

    - name: Verify private token is available
      if: endsWith(github.repository, '-private') && steps.app-token.outputs.token == ''
      shell: bash
      run: |
        echo "::error::Repository ends in '-private' but no auth was provided. Configure the CI GitHub App (vars.NITRO_CI_APP_CLIENT_ID and secrets.NITRO_CI_APP_PRIVATE_KEY)."
        exit 1

    - name: Initialize submodules (private)
      if: endsWith(github.repository, '-private')
      shell: bash
      env:
        TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        echo "::add-mask::${TOKEN}"
        # Tokens are opaque and their alphabet is not guaranteed: GitHub's new
        # stateless installation-token format is ghs_<id>_<base64url JWT>,
        # which contains '.' and '-'. Only catch what actually breaks git
        # auth: an empty token or embedded whitespace.
        if [[ -z "$TOKEN" || "$TOKEN" =~ [[:space:]] ]]; then
          echo "::error::Private token is empty or contains whitespace; check the App configuration."
          exit 1
        fi
        GITHUB_TOKEN="$TOKEN" scripts/ci-init-submodules.sh

    - name: Initialize submodules (public)
      if: "!endsWith(github.repository, '-private')"
      shell: bash
      run: git submodule update --init --recursive
