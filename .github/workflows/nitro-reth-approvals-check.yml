---
name: Check Nitro Reth Approvals

# Nitro Reth-only PRs skip design approval (see design-approved-check.yml)
# and instead require two approvals. Branch protection can't express a
# per-path approval count, so this check counts approvals itself and posts a
# commit status. For any PR that isn't reth-only it reports success
# immediately, so it can be a required status check for the whole branch.
#
# Deliberately not covered by the '_nitro-reth*.yml' light-path convention:
# a PR editing this file must go through the standard review process.

on:
  merge_group:
  pull_request_target:
    branches: [master, main, '*-release', '*-backports']
    types: [synchronize, opened, reopened]
  pull_request_review:

jobs:
  changes:
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/_detect-changes.yml
    secrets: inherit
    permissions:
      contents: read

  check-nitro-reth-approvals:
    name: Check Nitro Reth approvals
    runs-on: ubuntu-4
    needs: changes
    if: always()
    permissions:
      statuses: write
      pull-requests: read
    steps:
      - name: Count approvals and update status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo_url="${{ github.api_url }}/repos/$GITHUB_REPOSITORY"
          commit_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          status_state="success"  # default to success (merge_group, non-reth PRs)

          if [[ "$GITHUB_EVENT_NAME" != "merge_group" ]]; then
            # Fail without posting a status (leaving the previous state in
            # place) rather than treating an undetected diff as non-reth,
            # which would silently waive the approval requirement.
            if [[ "${{ needs.changes.result }}" != "success" ]]; then
              echo "Change detection failed; not updating the status."
              exit 1
            fi

            if [[ "${{ needs.changes.outputs.reth_only }}" == "true" ]]; then
              pr_number='${{ github.event.pull_request.number }}'
              # Latest non-comment review per reviewer decides their state.
              approvals=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/reviews" --paginate --slurp \
                | jq '[(add // []) | group_by(.user.login)[] | [.[] | select(.state != "COMMENTED")] | last | select(. != null and .state == "APPROVED")] | length')
              echo "Reth-only PR with ${approvals} approval(s)"
              status_state="pending"
              if [[ "$approvals" -ge 2 ]]; then
                status_state="success"
              fi
            fi
          fi

          curl -sSL --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${repo_url}/statuses/$commit_sha" \
            -d '{"context":"Nitro Reth Approvals Check","state":"'"$status_state"'"}'
