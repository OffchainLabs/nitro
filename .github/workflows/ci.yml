---
name: CI
run-name: CI triggered from @${{ github.actor }} of ${{ github.head_ref }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:

jobs:
  # --- Determine which files have changed ---
  changes:
    uses: ./.github/workflows/_detect-changes.yml
    secrets: inherit

  # --- Fast: Build + Lint only (required by can_proceed) ---
  fast:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    uses: ./.github/workflows/_fast.yml
    secrets: inherit

  # --- Run Rust tests (not required by can_proceed) ---
  rust-tests:
    needs: changes
    if: needs.changes.outputs.rust_changed == 'true'
    uses: ./.github/workflows/_rust-tests.yml
    secrets: inherit

  # --- Run Bold Legacy challenge tests (not required by can_proceed) ---
  bold-legacy:
    needs: changes
    if: needs.changes.outputs.bold_legacy_changed == 'true'
    uses: ./.github/workflows/_bold-legacy.yml
    secrets: inherit

  # --- Run Nitro Reth tests (not required by can_proceed) ---
  nitro-reth-tests:
    needs: changes
    if: needs.changes.outputs.nitro_reth_changed == 'true'
    uses: ./.github/workflows/_nitro-reth-tests.yml
    secrets: inherit

  # --- Full GO tests (not required by can_proceed) ---
  go-tests:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    uses: ./.github/workflows/_standard-go-test-suite.yml
    secrets: inherit

  # --- Record the tested tree so the merge queue can skip an identical re-run ---
  record-tested-tree:
    runs-on: ubuntu-4
    needs: go-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Create tree marker
        id: tree
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          touch go-tests-passed

      - name: Upload tree marker
        uses: actions/upload-artifact@v6
        with:
          name: go-tests-passed-tree-${{ steps.tree.outputs.tree }}
          path: go-tests-passed

  # --- MEL test modes: opt-in per-PR via the `test-mel` label. ---
  # MEL triples runner contention on arbitrator-ci; see _mel-go-test-suite.yml.
  mel-tests:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-mel')
    uses: ./.github/workflows/_mel-go-test-suite.yml
    secrets: inherit

  # --- Validation tests (not required by can_proceed) ---
  validation-tests:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    uses: ./.github/workflows/_validation-tests.yml
    secrets: inherit

  # --- Summarize test results (not required by can_proceed) ---
  codecov:
    needs: [go-tests, rust-tests]
    if: '!cancelled() && (needs.go-tests.result != ''skipped'' || needs.rust-tests.result != ''skipped'')'
    uses: ./.github/workflows/_codecov.yml
    secrets: inherit
    permissions:
      contents: read
    with:
      post_comment: true
      upload_report: false

  # --- Ensure changelog is updated (required by can_proceed) ---
  changelog:
    needs: changes
    uses: ./.github/workflows/_changelog.yml
    secrets: inherit
    with:
      changelog_fragments: ${{ needs.changes.outputs.changelog_added }}

  can_proceed:
    name: can_proceed
    runs-on: ubuntu-4
    if: always()
    needs: [fast, changelog]
    steps:
      - name: Verify required jobs passed
        run: |
          [[ "${{ needs.changelog.result }}" == "success" ]] || exit 1
          [[ "${{ needs.fast.result }}" =~ ^(success|skipped)$ ]] || exit 1

  can_see_status:
    # Depends on nothing, so it always runs and always reports a status on the
    # pull request page regardless of which other jobs were skipped.
    runs-on: ubuntu-4
    steps:
      - run: true
