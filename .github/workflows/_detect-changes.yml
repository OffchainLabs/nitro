---
name: detect-file-changes

on:
  workflow_call:
    outputs:
      rust_changed:
        description: 'True if Rust files changed.'
        value: ${{ jobs.changes.outputs.rust_changed }}
      bold_legacy_changed:
        description: 'True if Bold Legacy or related files changed.'
        value: ${{ jobs.changes.outputs.bold_legacy_changed }}
      changelog_added:
        description: 'New changelog fragments.'
        value: ${{ jobs.changes.outputs.changelog_added }}
      code_changed:
        description: 'True if any file other than CHANGELOG.md, changelog/**, or Nitro Reth files changed.'
        value: ${{ jobs.changes.outputs.code_changed }}
      nitro_reth_changed:
        description: 'True if Nitro Reth or related files changed.'
        value: ${{ jobs.changes.outputs.nitro_reth_changed }}
      reth_only:
        description: 'True if only Nitro Reth and changelog files changed.'
        value: ${{ jobs.changes.outputs.reth_only }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect file changes
    runs-on: ubuntu-4
    outputs:
      rust_changed: ${{ steps.changed.outputs.rust_any_changed }}
      bold_legacy_changed: ${{ steps.changed.outputs.bold_legacy_any_changed }}
      changelog_added: ${{ steps.changed.outputs.changelog_added_files }}
      code_changed: ${{ steps.changed.outputs.code_any_changed }}
      nitro_reth_changed: ${{ steps.changed.outputs.nitro_reth_any_changed }}
      reth_only: ${{ steps.changed.outputs.nitro_reth_any_changed == 'true' && steps.changed.outputs.code_any_changed != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 10            # Will cover most PRs
          persist-credentials: true  # In case changed-files requires deeper depth

      - name: Detect changes
        id: changed
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files_yaml: |
            rust:
              - 'crates/**'
              # Submodules aren't checked out here, so a contracts bump appears
              # in diffs as the bare gitlink path 'contracts', which the glob
              # form doesn't match. Keep both in case checkout behavior changes.
              - 'contracts'
              - 'contracts/**'
              - 'Makefile'
              - '**.toml'
              - '**/Cargo.lock'
              - '!nitro-reth/**'
              - '.github/workflows/_rust-tests.yml'
              - '.github/workflows/_detect-changes.yml'
            bold_legacy:
              - 'bold/legacy/**'
              - '.github/workflows/_bold-legacy.yml'
            nitro_reth:
              - 'nitro-reth/**'
              - '.github/workflows/_nitro-reth*.yml'
              - '.github/workflows/_detect-changes.yml'
              # Root configs that nitro-reth builds inherit (no local copies),
              # so toolchain/format bumps also run the reth suite.
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
            changelog:
              - 'changelog/**.md'
            code:
              - '**'
              - '!CHANGELOG.md'
              - '!changelog/**'
              - '!nitro-reth/**'
              - '!.github/workflows/_nitro-reth*.yml'
