---
name: nitro-reth-bench-pr

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: detect bench-relevant changes
    runs-on: ocl-4cpu-16ram
    timeout-minutes: 10
    outputs:
      bench_changed: ${{ steps.changed.outputs.bench_any_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 10
          persist-credentials: true
      - name: Detect changes
        id: changed
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47.0.0
        with:
          files_yaml: |
            bench:
              - 'nitro-reth/crates/**'
              - 'nitro-reth/bin/**'
              - 'nitro-reth/Cargo.toml'
              - 'nitro-reth/Cargo.lock'
              - 'nitro-reth/bench/corpus/**'
              - 'nitro-reth/genesis/**'
              - '.github/workflows/_nitro-reth-bench-pr.yml'
              - '.github/workflows/_nitro-reth-build-release.yml'

  build-feature:
    needs: changes
    if: needs.changes.outputs.bench_changed == 'true'
    uses: ./.github/workflows/_nitro-reth-build-release.yml
    with:
      artifact-name: bench-pr-feature-binaries
      include-bench-driver: true

  build-baseline:
    needs: changes
    if: needs.changes.outputs.bench_changed == 'true'
    uses: ./.github/workflows/_nitro-reth-build-release.yml
    with:
      artifact-name: bench-pr-baseline-binaries
      ref: ${{ github.base_ref }}

  abba:
    name: abba pr-gate
    needs: [build-feature, build-baseline]
    runs-on: ocl-16cpu-64ram
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: nitro-reth
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Init reth-referenced submodules
        working-directory: .
        run: git submodule update --init --depth 1 --recursive -- brotli contracts contracts-local/src/precompiles crates/tools/wasmer
      - uses: actions/download-artifact@v8
        with:
          name: bench-pr-feature-binaries
          path: nitro-reth/target/release-feature
      - uses: actions/download-artifact@v8
        with:
          name: bench-pr-baseline-binaries
          path: nitro-reth/target/release-baseline
      - name: Make binaries executable
        run: |
          chmod +x target/release-feature/arbreth-bench \
                   target/release-feature/arb-reth \
                   target/release-baseline/arb-reth
      - name: Run ABBA (baseline=${{ github.base_ref }}, feature=PR)
        run: |
          target/release-feature/arbreth-bench abba \
            --preset pr-gate \
            --iterations 3 \
            --tolerance-pct 5.0 \
            --bootstrap-iters 10000 \
            --baseline-bin "$PWD/target/release-baseline/arb-reth" \
            --feature-bin "$PWD/target/release-feature/arb-reth" \
            --genesis "$PWD/genesis/arbitrum-sepolia.json" \
            --out target/bench/abba \
            --markdown-out target/bench/abba/summary.md
      - name: Upload ABBA artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: abba-results
          path: nitro-reth/target/bench/abba
          retention-days: 30
      - name: Comment ABBA summary on PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = 'nitro-reth/target/bench/abba/summary.md';
            if (!fs.existsSync(path)) {
              core.warning('no abba summary file');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- arb-bench-abba-summary -->';
            const commentBody = `${marker}\n### arb-bench (PR-gate ABBA: \`${context.payload.pull_request.base.ref}\` vs PR)\n\n${body}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: commentBody,
              });
            }
