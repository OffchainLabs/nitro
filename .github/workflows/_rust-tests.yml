---
name: nitro-rust
on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Run Rust tests
    runs-on: arbitrator-ci
    env:
      RUST_BACKTRACE: 1
      RUSTFLAGS: -Dwarnings

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/init-submodules
        with:
          client-id: ${{ vars.NITRO_CI_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.NITRO_CI_APP_PRIVATE_KEY }}

      - name: Setup CI
        uses: ./.github/actions/ci-setup

      - name: Install custom go-ethereum
        run: |
          cd /tmp
          git clone --branch v1.16.2 --depth 1 https://github.com/ethereum/go-ethereum.git
          cd go-ethereum
          go build -o /usr/local/bin/geth ./cmd/geth

      - name: Setup emsdk
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984  # v16
        with:
          # Make sure to set a version number!
          version: 3.1.7
          # This is the name of the cache folder.
          # The cache folder will be placed in the build directory,
          #  so make sure it doesn't conflict with anything!
          no-cache: true

      # setup-emsdk prepends emscripten's bundled Node.js (14) to PATH, which
      # shadows the Node 24 from ci-setup and breaks `npm install` in the build
      # steps below. emcc locates its own Node via EMSDK_NODE, so re-asserting
      # Node 24 on PATH is safe.
      - name: Restore Node 24 on PATH after emsdk
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@0abfcd587b70a713fdaa7fb502c885e2112acb15  # v2
        with:
          tool: nextest@0.9

      - name: Create minimal nextest.toml config file
        run: |
          cat << EOF > nextest.toml
          [profile.ci.junit]
          path = "junit.xml"
          EOF

      - name: Make arbitrator libraries
        run: make -j8 wasm-ci-build

      - name: Prepare replay.wasm env
        run: make build-replay-env

      - name: Clippy check (non-SP1)
        run: cargo clippy --workspace -- -D warnings

      - name: Run rust tests
        id: run-rust-tests
        continue-on-error: true
        run: >-
          cargo nextest run -p arbutil -p prover -p jit -p stylus -p validator -p validation --release
          --profile ci --config-file nextest.toml

      # The rkyv-gated tests are compiled out of the default-features run
      # above, so run them in a dedicated pass.
      - name: Run validation tests (rkyv feature)
        run: cargo test -p validation --features rkyv --release

      - name: Upload rust test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-reports-rust
          path: ./target/nextest/ci/junit.xml

      - name: Fail if rust tests failed
        if: steps.run-rust-tests.outcome == 'failure'
        run: |
          echo "Rust tests failed. Failing the workflow as required."
          exit 1

      - name: Check stylus_bechmark
        run: cargo check --manifest-path crates/tools/stylus_benchmark/Cargo.toml

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt --profile minimal

      - name: Rustfmt
        run: cargo +nightly fmt -- --check

      - name: Rustfmt - tools/stylus_benchmark
        run: cargo +nightly fmt --manifest-path crates/tools/stylus_benchmark/Cargo.toml -- --check

      - name: Rustfmt - crates/sp1
        working-directory: crates/sp1
        run: cargo +nightly fmt -- --check

      - name: Make proofs from test cases
        run: make -j8 test-gen-proofs

      - name: Start geth server
        run: |
          geth --dev --http --http.port 8545 &
          sleep 2

      - name: Run proof validation tests
        run: |
          npm install --global yarn
          cd contracts-legacy
          cp -r ../contracts/test/prover/proofs/* ./test/prover/proofs
          yarn install
          yarn build
          yarn build:forge:yul
          yarn hardhat --network localhost test test/prover/*.ts
