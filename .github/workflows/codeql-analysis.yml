---
name: CodeQL

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.ref }}
  cancel-in-progress: true

on:
  merge_group:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '18 21 * * 5'

jobs:
  analyze:
    name: Analyze
    runs-on: ocl-16cpu-64ram-dind
    timeout-minutes: 35
    if: github.repository == 'OffchainLabs/nitro'  # avoid forks without "Advanced Security" enabled
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/init-submodules
        with:
          client-id: ${{ vars.NITRO_CI_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.NITRO_CI_APP_PRIVATE_KEY }}

      - name: Setup CI
        uses: ./.github/actions/ci-setup

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4
        with:
          languages: go
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build Nitro for CodeQL
        run: make build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4
        with:
          category: "/language:go"
