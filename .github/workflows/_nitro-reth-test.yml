---
name: nitro-reth-test

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  nextest:
    name: unit tests (nextest)
    runs-on: ocl-16cpu-64ram
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nitro-reth
    steps:
      - uses: actions/checkout@v6
      - name: Init nitro-reth submodules
        # Override the job's nitro-reth working-directory: the pathspec is
        # relative to the cwd, and a recursive checkout at the checkout step
        # would pull nitro's whole submodule tree instead of just these.
        working-directory: .
        run: git submodule update --init --depth 1 --recursive -- nitro-reth
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential clang libclang-dev cmake
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nitro-reth
      - uses: taiki-e/install-action@0abfcd587b70a713fdaa7fb502c885e2112acb15  # v2
        with:
          tool: cargo-nextest
      - name: Run unit + integration tests
        run: cargo nextest run --workspace --profile ci

  doctests:
    name: doctests
    runs-on: ocl-16cpu-64ram
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nitro-reth
    steps:
      - uses: actions/checkout@v6
      - name: Init nitro-reth submodules
        # Override the job's nitro-reth working-directory: the pathspec is
        # relative to the cwd, and a recursive checkout at the checkout step
        # would pull nitro's whole submodule tree instead of just these.
        working-directory: .
        run: git submodule update --init --depth 1 --recursive -- nitro-reth
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential clang libclang-dev cmake
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nitro-reth
      - run: cargo test --doc --workspace
