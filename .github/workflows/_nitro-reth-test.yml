---
name: nitro-reth-test

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  nextest:
    name: unit tests (nextest)
    runs-on: ocl-16cpu-64ram
    timeout-minutes: 45
    defaults:
      run:
        working-directory: nitro-reth
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nitro-reth-setup
        with:
          client-id: ${{ vars.NITRO_CI_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.NITRO_CI_APP_PRIVATE_KEY }}
          brotli: "true"
      - uses: taiki-e/install-action@0abfcd587b70a713fdaa7fb502c885e2112acb15  # v2
        with:
          tool: cargo-nextest
      - name: Run unit + integration tests
        run: cargo nextest run --workspace --profile ci

  wasm-replay:
    name: Test replay wasm
    runs-on: ocl-16cpu-64ram
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nitro-reth
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nitro-reth-setup
        with:
          client-id: ${{ vars.NITRO_CI_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.NITRO_CI_APP_PRIVATE_KEY }}
          targets: wasm32-wasip1
          brotli: "true"
      - run: cargo test -p arb-replay --release --test wasm_runner -- --ignored

  doctests:
    name: doctests
    runs-on: ocl-16cpu-64ram
    timeout-minutes: 45
    defaults:
      run:
        working-directory: nitro-reth
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nitro-reth-setup
        with:
          client-id: ${{ vars.NITRO_CI_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.NITRO_CI_APP_PRIVATE_KEY }}
          brotli: "true"
      - run: cargo test --doc --workspace
