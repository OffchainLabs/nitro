name: Run SP1 runner on `replay.wasm`

on:
  workflow_dispatch:
  pull_request:
    branches:
      - zk-prove-any/sp1-runner

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zk-proving:
    name: Run SP1 runner on `replay.wasm`
    runs-on: arbitrator-ci
    defaults:
      run:
        shell: bash
    env:
      BASE_LABEL: base
      HEAD_LABEL: head
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_REPO_PAT || github.token }}

      - uses: ./.github/actions/init-submodules
        with:
          client-id: ${{ vars.NITRO_CI_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.NITRO_CI_APP_PRIVATE_KEY }}
          pat: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Setup CI
        uses: ./.github/actions/ci-setup

      - name: Install protobuf-compiler
        run: sudo apt install -y protobuf-compiler

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 21

      - name: Install SP1 toolchain
        run: make -C crates/sp1 install-sp1

      - name: Build binaries
        run: make -C crates/sp1 build

      - name: Record block inputs
        run: make -C crates/sp1 record-blocks

      # Clippy runs after build because sp1-builder uses include_elf!(),
      # which requires the SP1 ELF to exist at compile time.
      - name: Clippy check (SP1)
        run: cargo clippy -p program -p sp1-builder -p sp1-runner -p stylus-compiler-program -p stylus-compiler-runner -- -D warnings -A static_mut_refs -A clippy::too_many_arguments

      - name: Run stylus-compiler-runner compare
        # Compare compilation consistency between running it natively and in the SP1 execution mode.
        run: cargo run -p stylus-compiler-runner --release -- compare

      - name: Run validation
        run: |
          # Exit if any command in a pipe fails
          set -e -o pipefail

          # Cross-check SP1 (RISC-V, in-zkVM) against JIT (native) on each block.
          for BLOCK in stylus stylus_activation stylus_activation_multicall; do
            echo "--- Running SP1 Validation ($BLOCK) ---"
            # Extracting only the hex string using grep -o
            SP1_HASH=$(make -C crates/sp1 run BLOCK="$BLOCK" 2>&1 \
              | grep "Validation succeeds with hash" \
              | awk '{print $NF}')

            if [ -z "$SP1_HASH" ]; then
                echo "::error::Failed to capture SP1 hash for $BLOCK."
                exit 1
            fi

            echo "--- Running JIT Validation ($BLOCK) ---"
            JIT_HASH=$(./target/bin/jit \
              --debug --cranelift \
              --binary target/machines/latest/replay.wasm \
              json --inputs="target/sp1/block-inputs/$BLOCK.json" 2>&1 \
              | grep "Completed in .* with hash" \
              | awk '{print $NF}' \
              | sed 's/\.$//')

            if [ -z "$JIT_HASH" ]; then
                echo "::error::Failed to capture JIT hash for $BLOCK."
                exit 1
            fi

            echo "$BLOCK SP1 Hash: $SP1_HASH"
            echo "$BLOCK JIT Hash: $JIT_HASH"

            if [ "$SP1_HASH" != "$JIT_HASH" ]; then
                echo "::error::Hash mismatch detected for $BLOCK!"
                echo "SP1: $SP1_HASH"
                echo "JIT: $JIT_HASH"
                exit 1
            fi
          done

      - name: Clean up stale profiling artifacts
        if: github.event_name == 'pull_request'
        run: |
          rm -f "target/sp1/profile-${BASE_LABEL}.json" "target/sp1/profile-${HEAD_LABEL}.json"
          rm -f "target/sp1/profile-delta-${BASE_LABEL}-vs-${HEAD_LABEL}.md"
          rm -f /tmp/profile.py /tmp/profile_delta.py /tmp/Makefile /tmp/prover

      - name: Profile PR branch
        if: github.event_name == 'pull_request'
        run: make -C crates/sp1 profile-snapshot LABEL="$HEAD_LABEL"

      - name: Checkout base branch
        if: github.event_name == 'pull_request'
        run: |
          cp crates/sp1/profile.py /tmp/profile.py
          cp crates/sp1/profile_delta.py /tmp/profile_delta.py
          cp crates/sp1/Makefile /tmp/Makefile
          cp target/bin/prover /tmp/prover
          git fetch --no-recurse-submodules origin ${{ github.base_ref }}
          git checkout FETCH_HEAD

      - name: Init submodules (base branch)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/init-submodules
        with:
          client-id: ${{ vars.NITRO_CI_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.NITRO_CI_APP_PRIVATE_KEY }}
          pat: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Build binaries (base branch)
        if: github.event_name == 'pull_request'
        run: make -C crates/sp1 build

      - name: Profile base branch
        if: github.event_name == 'pull_request'
        run: >
          cd crates/sp1 && make -f /tmp/Makefile profile-snapshot
          LABEL="$BASE_LABEL"
          PROFILE_SCRIPT=/tmp/profile.py
          PROVER_BIN=/tmp/prover

      - name: Compare profiles
        if: github.event_name == 'pull_request'
        run: >
          cd crates/sp1 && make -f /tmp/Makefile profile-compare
          BASE="$BASE_LABEL" NEW="$HEAD_LABEL"
          PROFILE_DELTA_SCRIPT=/tmp/profile_delta.py

      - name: Mint token
        if: github.event_name == 'pull_request'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NITRO_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.NITRO_CI_APP_PRIVATE_KEY }}

      - name: Post profile delta comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const deltaPath = `target/sp1/profile-delta-${process.env.BASE_LABEL}-vs-${process.env.HEAD_LABEL}.md`;
            const body = fs.readFileSync(deltaPath, 'utf8');
            const marker = '<!-- sp1-profile-comment -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );
            const existing = comments.find(c => (c.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
