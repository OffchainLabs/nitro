name: Run SP1 runner on `replay.wasm`

on:
  workflow_dispatch:
  pull_request:
    branches:
      - zk-prove-any/sp1-runner

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zk-proving:
    name: Run SP1 runner on `replay.wasm`
    runs-on: arbitrator-ci
    defaults:
      run:
        shell: bash
    env:
      PROFILE_OLD: /tmp/profile-old.json
      PROFILE_NEW: /tmp/profile-new.json
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_REPO_PAT || github.token }}

      - uses: ./.github/actions/init-submodules
        with:
          private-token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Setup CI
        uses: ./.github/actions/ci-setup

      - name: Install protobuf-compiler
        run: sudo apt install -y protobuf-compiler

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 21

      - name: Install SP1 toolchain
        run: make -C crates/sp1 install-sp1

      - name: Print versions
        run: |
          rustc +succinct --version
          rustc +succinct --print target-list | grep succinct

      - name: Build binaries
        run: make -C crates/sp1 build

      - name: Record block inputs
        run: make -C crates/sp1 record-blocks

      # Clippy runs after build because sp1-builder uses include_elf!(),
      # which requires the SP1 ELF to exist at compile time.
      - name: Clippy check (SP1)
        run: cargo clippy -p program -p sp1-builder -p sp1-runner -p stylus-compiler-program -p stylus-compiler-runner -- -D warnings -A static_mut_refs -A clippy::too_many_arguments

      - name: Run stylus-compiler-runner compare
        # Compare compilation consistency between running it natively and in the SP1 execution mode.
        run: cargo run -p stylus-compiler-runner --release -- compare

      - name: Run validation
        run: |
          # Exit if any command in a pipe fails
          set -e -o pipefail

          echo "--- Running SP1 Validation ---"
          # Extracting only the hex string using grep -o
          SP1_HASH=$(make -C crates/sp1 run BLOCK=stylus 2>&1 \
            | grep "Validation succeeds with hash" \
            | awk '{print $NF}')

          if [ -z "$SP1_HASH" ]; then
              echo "Error: Failed to capture hash."
              exit 1
          fi

          echo "--- Running JIT Validation ---"
          JIT_HASH=$(./target/bin/jit \
            --debug --cranelift \
            --binary target/machines/latest/replay.wasm \
            json --inputs=target/sp1/block-inputs/stylus.json 2>&1 \
            | grep "Completed in .* with hash" \
            | awk '{print $NF}' \
            | sed 's/\.$//')

          if [ -z "$JIT_HASH" ]; then
              echo "Error: Failed to capture JIT hash."
              exit 1
          fi

          echo "SP1 Hash: $SP1_HASH"
          echo "JIT Hash: $JIT_HASH"

          if [ "$SP1_HASH" != "$JIT_HASH" ]; then
              echo "::error::Hash mismatch detected!"
              echo "Expected: $SP1_HASH"
              echo "Actual:   $JIT_HASH"
              exit 1
          fi

      - name: Clean up stale profiling artifacts
        if: github.event_name == 'pull_request'
        run: rm -f "$PROFILE_OLD" "$PROFILE_NEW" /tmp/comment.md /tmp/profile{,_delta}.py /tmp/Makefile

      - name: Profile PR branch
        if: github.event_name == 'pull_request'
        run: make -C crates/sp1 profile JSON_OUTPUT="$PROFILE_NEW"

      - name: Checkout base branch
        if: github.event_name == 'pull_request'
        run: |
          cp crates/sp1/profile.py /tmp/profile.py
          cp crates/sp1/profile_delta.py /tmp/profile_delta.py
          cp crates/sp1/Makefile /tmp/Makefile
          git fetch --no-recurse-submodules origin ${{ github.base_ref }}
          git checkout FETCH_HEAD

      - name: Init submodules (base branch)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/init-submodules
        with:
          private-token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Build binaries (base branch)
        if: github.event_name == 'pull_request'
        run: make -C crates/sp1 build

      - name: Profile base branch
        if: github.event_name == 'pull_request'
        run: >
          cd crates/sp1 && make -f /tmp/Makefile profile
          PROFILE_SCRIPT=/tmp/profile.py
          JSON_OUTPUT="$PROFILE_OLD"

      - name: Compute profile delta
        if: github.event_name == 'pull_request'
        run: |
          python3 /tmp/profile_delta.py \
            --old "$PROFILE_OLD" \
            --new "$PROFILE_NEW" \
            --output /tmp/comment.md

      - name: Mint token
        if: github.event_name == 'pull_request'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NITRO_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.NITRO_CI_APP_PRIVATE_KEY }}

      - name: Post profile delta comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/comment.md', 'utf8');
            const marker = '<!-- sp1-profile-comment -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );
            const existing = comments.find(c => (c.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
