---
name: nitro-go-tests
on:
  workflow_call:
    inputs:
      run-name:
        required: true
        type: string
        description: "The name of the test run. It will be used for labeling artifacts."
      run-defaults-a:
        required: false
        type: boolean
      run-defaults-b:
        required: false
        type: boolean
      run-flaky:
        required: false
        type: boolean
      run-pathdb-a:
        required: false
        type: boolean
      run-pathdb-b:
        required: false
        type: boolean
      run-stylus:
        required: false
        type: boolean
      run-challenge-a:
        required: false
        type: boolean
      run-challenge-b:
        required: false
        type: boolean
      run-l3challenge:
        required: false
        type: boolean
      run-legacy-challenge:
        required: false
        type: boolean
      run-race:
        required: false
        type: boolean
      run-long:
        required: false
        type: boolean
      run-execution-spec-tests:
        required: false
        type: boolean
      run-pebble-a:
        required: false
        type: boolean
      run-pebble-b:
        required: false
        type: boolean
      run-defaults-a-mel:
        required: false
        type: boolean
      run-defaults-b-mel:
        required: false
        type: boolean
      run-pathdb-a-mel:
        required: false
        type: boolean
      run-pathdb-b-mel:
        required: false
        type: boolean
      run-flaky-mel:
        required: false
        type: boolean
      run-consensus-execution-rpc-a:
        required: false
        type: boolean
      run-consensus-execution-rpc-b:
        required: false
        type: boolean

permissions:
  contents: read

jobs:
  go-tests:
    name: Go tests
    runs-on: ocl-16cpu-64ram-dind
    # Hard cap so a hung job is killed at 1.5h instead of GitHub's 6h default.
    # Kept above every per-step Go `--timeout` (<=70m) plus the ~15m build, so on
    # a hung test the Go timeout fires first and prints a goroutine stack trace
    # before the job cap terminates the runner.
    timeout-minutes: 90
    env:
      COVER: ${{ github.event_name != 'merge_group' && '--cover' || '' }}
    services:
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: submods
        uses: ./.github/actions/init-submodules
        with:
          client-id: ${{ vars.NITRO_CI_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.NITRO_CI_APP_PRIVATE_KEY }}

      - name: Setup CI
        uses: ./.github/actions/ci-setup

      - name: Set environment variables
        run: |
          mkdir -p target/tmp/deadbeefbee
          echo "TMPDIR=$(pwd)/target/tmp/deadbeefbee" >> "$GITHUB_ENV"
          echo "GOMEMLIMIT=6GiB" >> "$GITHUB_ENV"
          echo "GOGC=80" >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"
          # Scale pollUntil / retryUntilFound timeouts for loaded shared CI runners.
          # Consumed by system_tests helpers (see getTestTimeoutScale in common_test.go).
          echo "NITRO_TEST_TIMEOUT_SCALE=2.0" >> "$GITHUB_ENV"

      - name: Build
        run: make -j8 build test-go-deps

      - name: Build node dependencies
        run: make -j8 build-node-deps

      # --------------------- PATHDB MODE ---------------------

      - name: run tests without race detection and path state scheme (A-batch)
        if: inputs.run-pathdb-a
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags cionly --timeout 70m $COVER --test_state_scheme path
          --junitfile test-results/junit-pathdb-a.xml --run '^Test[A-L]' --reduce-parallelism

      - name: run tests without race detection and path state scheme (B-batch)
        if: inputs.run-pathdb-b
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags cionly --timeout 70m $COVER --test_state_scheme path
          --junitfile test-results/junit-pathdb-b.xml --skip '^Test[A-L]' --reduce-parallelism

      # --------------------- DEFAULTS MODE ---------------------

      - name: run tests without race detection and hash state scheme (A-batch)
        if: inputs.run-defaults-a
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags cionly --timeout 60m $COVER --coverprofile coverage-a.txt --test_state_scheme hash
          --junitfile test-results/junit-defaults-a.xml --run '^Test[A-L]'
      - name: run tests without race detection and hash state scheme (B-batch)
        if: inputs.run-defaults-b
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags cionly --timeout 60m $COVER --coverprofile coverage-b.txt --test_state_scheme hash
          --junitfile test-results/junit-defaults-b.xml --skip '^Test[A-L]'

      # --------------------- CONSENSUS AND EXECUTION OVER RPC MODE ---------------------

      - name: run tests with consensus and execution nodes connected over json rpc (A-batch)
        if: inputs.run-consensus-execution-rpc-a
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags cionly --timeout 60m --cover --test_state_scheme hash --consensus_execution_in_same_process_use_rpc
          --junitfile test-results/junit-consensus-execution-rpc-a.xml --run '^Test[A-L]'

      - name: run tests with consensus and execution nodes connected over json rpc (B-batch)
        if: inputs.run-consensus-execution-rpc-b
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags cionly --timeout 60m --cover --test_state_scheme hash --consensus_execution_in_same_process_use_rpc
          --junitfile test-results/junit-consensus-execution-rpc-b.xml --skip '^Test[A-L]'

      # --------------------- PATHDB MEL MODE ---------------------

      - name: run tests without race detection and path state scheme (A-batch, MEL)
        if: inputs.run-pathdb-a-mel
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags cionly --timeout 70m $COVER --test_state_scheme path
          --junitfile test-results/junit-pathdb-a-mel.xml --run '^Test[A-L]' --reduce-parallelism --test_mel

      - name: run tests without race detection and path state scheme (B-batch, MEL)
        if: inputs.run-pathdb-b-mel
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags cionly --timeout 70m $COVER --test_state_scheme path
          --junitfile test-results/junit-pathdb-b-mel.xml --skip '^Test[A-L]' --reduce-parallelism --test_mel

      # --------------------- DEFAULTS MEL MODE ---------------------

      - name: run tests without race detection and hash state scheme (A-batch, MEL)
        if: inputs.run-defaults-a-mel
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags cionly --timeout 60m --test_state_scheme hash
          --junitfile test-results/junit-defaults-a-mel.xml --run '^Test[A-L]' --test_mel
      - name: run tests without race detection and hash state scheme (B-batch, MEL)
        if: inputs.run-defaults-b-mel
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags cionly --timeout 60m --test_state_scheme hash
          --junitfile test-results/junit-defaults-b-mel.xml --skip '^Test[A-L]' --test_mel
      - name: run redis tests
        if: inputs.run-defaults-a
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags cionly --timeout 60m $COVER --coverprofile coverage-redis.txt
          --run TestRedis --packages './arbnode/... ./pubsub/... ./system_tests/...'
          --test_redis redis://localhost:6379/0
          --junitfile test-results/junit-redis.xml

      # --------------------- FLAKY MODE --------------------------

      - name: run flaky tests (hash state scheme)
        if: inputs.run-flaky
        continue-on-error: true
        timeout-minutes: 30
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags cionly --timeout 25m --test_state_scheme hash --flaky
          --junitfile test-results/junit-flaky-hash.xml

      - name: run flaky tests (path state scheme)
        if: inputs.run-flaky
        continue-on-error: true
        timeout-minutes: 30
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags cionly --timeout 25m --test_state_scheme path --flaky
          --junitfile test-results/junit-flaky-path.xml

      - name: run flaky redis tests
        if: inputs.run-flaky
        continue-on-error: true
        timeout-minutes: 15
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags cionly --timeout 10m --flaky
          --run TestRedis --packages './arbnode/... ./pubsub/... ./system_tests/...'
          --test_redis redis://localhost:6379/0
          --junitfile test-results/junit-flaky-redis.xml

      - name: run flaky tests (hash state scheme, MEL)
        if: inputs.run-flaky-mel
        continue-on-error: true
        timeout-minutes: 30
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags cionly --timeout 25m --test_state_scheme hash --flaky --test_mel
          --junitfile test-results/junit-flaky-mel-hash.xml

      - name: run flaky tests (path state scheme, MEL)
        if: inputs.run-flaky-mel
        continue-on-error: true
        timeout-minutes: 30
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags cionly --timeout 25m --test_state_scheme path --flaky --test_mel
          --junitfile test-results/junit-flaky-mel-path.xml

      # --------------------- CHALLENGE MODES ---------------------

      # The challenge suite is split across two shards to keep wall-clock off the
      # CI critical path. The ~8 heavy TestChallengeProtocolBOLD* system tests run
      # serially at ~4.5min each; the CustomDA group (A) balances against the
      # ReadInbox/StartStep group plus all the fast tests (B), ~18min each.
      - name: run challenge tests (CustomDA, A-batch)
        if: inputs.run-challenge-a
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh --tags challengetest
          --run TestChallengeProtocolBOLDCustomDA --timeout 70m $COVER
          --junitfile test-results/junit-challenge-a.xml

      - name: run challenge tests (B-batch)
        if: inputs.run-challenge-b
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh --tags challengetest
          --run TestChallenge --skip TestChallengeProtocolBOLDCustomDA --timeout 70m $COVER
          --junitfile test-results/junit-challenge-b.xml

      - name: run L3 challenge tests
        if: inputs.run-l3challenge
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags challengetest --run TestL3Challenge --timeout 70m $COVER
          --junitfile test-results/junit-l3challenge.xml

      - name: run legacy challenge tests
        if: inputs.run-legacy-challenge
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh --tags legacychallengetest
          --run TestChallenge --timeout 60m $COVER
          --junitfile test-results/junit-legacy-challenge.xml

      # --------------------- STYLUS MODE ---------------------

      - name: run stylus tests
        if: inputs.run-stylus
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --tags stylustest --run TestProgramArbitrator --timeout 60m $COVER
          --junitfile test-results/junit-stylus.xml

      # --------------------- RACE MODE ---------------------

      - name: run race tests
        if: inputs.run-race
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh
          --race --timeout 70m --test_state_scheme hash
          --junitfile test-results/junit-race.xml

      # --------------------- LONG MODE ---------------------

      - name: run long tests
        if: inputs.run-long
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh --tags stylustest
          --run TestProgramLong --timeout 60m $COVER
          --junitfile test-results/junit-long.xml

      # --------------------- EXECUTION SPEC MODE ---------------------

      - name: run execution spec tests
        if: inputs.run-execution-spec-tests
        env:
          PRIVATE_REPO_TOKEN: ${{ github.repository == 'OffchainLabs/nitro-private' && steps.submods.outputs.token || '' }}
        run: ${{ github.workspace }}/.github/workflows/runExecutionSpecTests.sh

      # --------------------- PEBBLE MODE ---------------------

      - name: run pebble tests (A-batch)
        if: inputs.run-pebble-a
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh --timeout 70m --test_database_engine pebble
          --junitfile test-results/junit-pebble-a.xml --run '^Test[A-N]' --reduce-parallelism
      - name: run pebble tests (B-batch)
        if: inputs.run-pebble-b
        run: >-
          ${{ github.workspace }}/.github/workflows/gotestsum.sh --timeout 70m --test_database_engine pebble
          --junitfile test-results/junit-pebble-b.xml --skip '^Test[A-N]' --reduce-parallelism

      # --------------------- PROCESS JUNIT LOGS ---------------------

      - name: Process JUnit XML logs
        if: always()
        run: python3 ${{ github.workspace }}/.github/workflows/process_junit.py test-results/

      - name: Upload Go test Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-reports-go-${{ inputs.run-name }}
          path: test-results/junit*.xml

      - name: Upload coverage to Codecov
        if: github.event_name != 'merge_group' && github.repository == 'OffchainLabs/nitro-private'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          fail_ci_if_error: false
          files: ./coverage.txt,./coverage-a.txt,./coverage-b.txt,./coverage-redis.txt
          verbose: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # --------------------- ARCHIVE LOGS FOR ALL MODES ---------------------

      - name: Archive detailed run log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.run-name }}-full.log
          path: full.log
